[package]
name = "inference-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.95"
axum = { version = "0.8.1", features = ["macros"] }
encoding_rs = "0.8.35"
llama-cpp-2 = "0.1.154"
dotenvy = "0.15"
names = "0.14"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1.41"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tokio = { version = "1.43.0", features = ["full"] }
tracing-subscriber = "0.3.19"